<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%"
     shape-rendering="crispEdges" role="img" aria-label="Synapse Remote">
  <title>Synapse Remote</title>

  <!-- Grade de 16x16 celulas de 32px. Nenhuma coordenada fora do multiplo de 32:
       o icone continua nitido em qualquer tamanho que o sistema pedir, e nao ha
       gradiente, desfoque ou diagonal suavizada para borrar a escada de pixels.
       Cores de src/Synapse.Tray/UI/PixelTheme.xaml (identidade Verde-Musgo).

       O manifesto declara purpose "any maskable", entao o Android pode recortar
       este icone num circulo de 80% do lado. Por isso o fundo sangra ate a borda
       (sem moldura, que apareceria cortada) e todo o desenho cabe dentro do raio
       seguro de 204px a partir do centro — o canto externo de cada no fica a 181px. -->

  <rect x="0" y="0" width="512" height="512" fill="#262019"/>

  <!-- ligacoes: uma celula em diagonal, do nucleo para cada no -->
  <g fill="#6B5B43">
    <rect x="192" y="192" width="32" height="32"/>
    <rect x="288" y="192" width="32" height="32"/>
    <rect x="192" y="288" width="32" height="32"/>
    <rect x="288" y="288" width="32" height="32"/>
  </g>

  <!-- quatro nos perifericos: as mesmas quatro cores dos ladrilhos da bandeja -->
  <rect x="128" y="128" width="64" height="64" fill="#7FB069"/>
  <rect x="320" y="128" width="64" height="64" fill="#A585D6"/>
  <rect x="128" y="320" width="64" height="64" fill="#B8CF4C"/>
  <rect x="320" y="320" width="64" height="64" fill="#E0A030"/>

  <!-- nucleo -->
  <rect x="224" y="224" width="64" height="64" fill="#EFE0C2"/>
</svg>
