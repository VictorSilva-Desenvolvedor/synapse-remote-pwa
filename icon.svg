<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo Arredondado Escuro -->
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Nó Central e Órbitas -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="6" />

  <!-- Conexões Sinápticas -->
  <line x1="256" y1="96" x2="256" y2="180" stroke="url(#synapseGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="332" x2="256" y2="416" stroke="url(#synapseGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="96" y1="256" x2="180" y2="256" stroke="url(#synapseGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="332" y1="256" x2="416" y2="256" stroke="url(#synapseGrad)" stroke-width="12" stroke-linecap="round" />
  
  <line x1="142" y1="142" x2="202" y2="202" stroke="url(#synapseGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="310" y1="310" x2="370" y2="370" stroke="url(#synapseGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="142" y1="370" x2="202" y2="310" stroke="url(#synapseGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="310" y1="202" x2="370" y2="142" stroke="url(#synapseGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Satélites -->
  <circle cx="256" cy="96" r="18" fill="#6366f1" />
  <circle cx="256" cy="416" r="18" fill="#a855f7" />
  <circle cx="96" cy="256" r="18" fill="#6366f1" />
  <circle cx="416" cy="256" r="18" fill="#a855f7" />

  <!-- Núcleo Sináptico Central com Glow -->
  <circle cx="256" cy="256" r="54" fill="url(#synapseGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
</svg>
